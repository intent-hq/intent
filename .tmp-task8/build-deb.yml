# Post-announce hook for the dist Release pipeline (see dist-workspace.toml
# `post-announce-jobs`). cargo-dist has no native .deb installer, so after a
# tagged release is published this repacks the released Linux musl tarballs
# into Debian packages — binary at /usr/bin/intentd plus a systemd *user*
# unit at /usr/lib/systemd/user/intentd.service (see scripts/build-deb.sh) —
# and uploads intentd_<version>_{amd64,arm64}.deb onto the same GitHub
# release.
#
# Dry-runnable via workflow_dispatch: pass an existing release tag and leave
# `upload` false to get the .debs as workflow artifacts without touching the
# release.
name: Build deb packages

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build .debs for (e.g. v0.1.1)"
        required: true
        type: string
      upload:
        description: "Upload the .debs to the release (default: workflow artifacts only)"
        required: false
        default: false
        type: boolean

jobs:
  build-deb:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PLAN: ${{ inputs.plan }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Determine tag
        id: meta
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [[ -n "${PLAN:-}" ]]; then
            tag=$(jq -r '.announcement_tag // empty' <<<"$PLAN")
          else
            tag=$DISPATCH_TAG
          fi
          if [[ -z "$tag" ]]; then
            echo "error: no tag (no announcement_tag in plan, no dispatch input)" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Download released musl tarballs
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'intentd-x86_64-unknown-linux-musl.tar.xz' \
            --pattern 'intentd-aarch64-unknown-linux-musl.tar.xz'
      - name: Build .debs
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          ./scripts/build-deb.sh intentd-x86_64-unknown-linux-musl.tar.xz "$VERSION" amd64
          ./scripts/build-deb.sh intentd-aarch64-unknown-linux-musl.tar.xz "$VERSION" arm64
      - name: Verify package metadata and contents
        run: |
          for deb in intentd_*.deb; do
            dpkg-deb --info "$deb"
            dpkg-deb --contents "$deb"
            test "$(dpkg-deb --field "$deb" Package)" = intentd
            dpkg-deb --contents "$deb" | grep -q ' \./usr/bin/intentd$'
            dpkg-deb --contents "$deb" | grep -q ' \./usr/lib/systemd/user/intentd\.service$'
          done
      - name: Upload .debs to release
        if: ${{ inputs.plan != '' || inputs.upload }}
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          gh release upload "$TAG" intentd_*.deb --clobber --repo "$GITHUB_REPOSITORY"
      - name: Upload .debs as workflow artifacts (dry run)
        if: ${{ inputs.plan == '' && !inputs.upload }}
        uses: actions/upload-artifact@v6
        with:
          name: debs
          path: intentd_*.deb

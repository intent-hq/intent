name: Depot managed Rust cache
description: Use the Depot runner's managed sccache backend for compilation.
runs:
  using: composite
  steps:
    - name: Require Depot managed cache
      shell: bash
      run: |
        if [ -z "${SCCACHE_WEBDAV_ENDPOINT:-}" ]; then
          echo "::error::Depot managed sccache is unavailable. Enable automatic Depot Cache access for this repository."
          exit 1
        fi
        # Preserve Depot's job-scoped endpoint/authentication. Never print them.
        {
          echo 'SCCACHE_GHA_ENABLED=false'
          echo 'CARGO_INCREMENTAL=0'
          echo 'RUSTC_WRAPPER=sccache'
        } >> "$GITHUB_ENV"
    - name: Install sccache
      uses: mozilla-actions/sccache-action@d651010b8da762cde178750d8eda7b5febfe147a # v0.0.9
      with:
        version: v0.17.0

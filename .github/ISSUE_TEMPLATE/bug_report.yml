name: Bug report
description: Report a bug in intentd, cloudlands-fe, ios, or docs/tooling
type: Bug
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected vs actual
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true
  - type: checkboxes
    id: component
    attributes:
      label: Component
      description: >
        Check all that apply. Labels are applied automatically from the
        checked boxes (`component:intentd`, `component:fe`, `component:ios`,
        `docs`).
      options:
        - label: intentd (Rust backend daemon)
        - label: cloudlands-fe (Electron + SvelteKit desktop frontend)
        - label: ios (SwiftUI companion app)
        - label: docs / tooling
  # Severity → Priority field mapping (each option maps 1:1 onto a Priority
  # field option, keyed on the leading token; the parser also still accepts
  # the former P0–P3 tokens: P0 → Urgent, P1 → High, P2 → Medium, P3 → Low):
  #   Urgent — … → Priority: Urgent
  #   High — …   → Priority: High
  #   Medium — … → Priority: Medium
  #   Low — …    → Priority: Low
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: >
        Your selection sets the issue's Priority field automatically (only
        when the field is still empty).
      options:
        - Urgent — crash, data loss, or corruption; blocks shipping to external users
        - High — broken feature; app still usable but with significant workaround required
        - Medium — degraded behavior; should be fixed, but impact is limited
        - Low — papercut; annoying but does not block workflows
    validations:
      required: true
  - type: checkboxes
    id: agent-filed
    attributes:
      label: Agent-filed
      options:
        - label: This issue was filed by an AI agent (the `agent-filed` label is applied automatically)

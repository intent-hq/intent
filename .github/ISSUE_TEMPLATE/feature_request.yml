name: Feature request
description: Propose an enhancement or new capability
type: Feature
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem does this solve? Why is it needed?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should happen?
    validations:
      required: true
  - type: checkboxes
    id: component
    attributes:
      label: Component
      description: >
        Check all that apply. Labels are applied automatically from the
        checked boxes (`component:intentd`, `component:fe`, `component:ios`,
        `docs`).
      options:
        - label: intentd (Rust backend daemon)
        - label: cloudlands-fe (Electron + SvelteKit desktop frontend)
        - label: ios (SwiftUI companion app)
        - label: docs / tooling
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you considered, and why they were rejected.

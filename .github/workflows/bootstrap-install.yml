# Runs scripts/bootstrap-dev-host.sh in install mode on a clean ubuntu:24.04
# container and asserts that the follow-up --check passes. The hermetic
# shell-tests job in ci.yml stubs every installer, so an install_* regression
# (a Node major node-gyp rejects, a renamed apt package, a dead upstream URL —
# intent-hq/intent#4669) only surfaced on a developer's host. This job
# executes the real apt / NodeSource / cli.github.com / rustup / nexte.st
# paths instead.
#
# Called by required queue CI for relevant changes; weekly/manual runs catch
# upstream installer drift. PRs never install the complete toolchain.
name: bootstrap-install
on:
  workflow_call:
    secrets:
      CI_QUEUE_READ_TOKEN:
        required: false
  schedule:
    # Mondays 06:17 UTC — upstream repo drift backstop (NodeSource, cli.github.com).
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Hosted only: the clean-install check runs `sudo docker`, and the
  # intent-cache runner containers have neither sudo nor a Docker socket.
  bootstrap-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0
      - name: Select bootstrap changes
        id: select
        env:
          EVENT: ${{ github.event_name }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          QUEUE_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          selected=true
          if [ "$EVENT" = merge_group ]; then
            [[ "$QUEUE_BASE" =~ ^[0-9a-f]{40}$ ]]
            test "$(git rev-parse HEAD)" = "$QUEUE_HEAD"
            changed=$(mktemp)
            git diff --name-only "$QUEUE_BASE" HEAD -- scripts/bootstrap-dev-host.sh scripts/bootstrap-dev-host.test.sh scripts/retry.sh scripts/github-readiness.sh scripts/github_readiness.py packages/intentd packages/cloudlands-fe .gitmodules .github/workflows/bootstrap-install.yml .github/workflows/ci.yml > "$changed"
            if [ ! -s "$changed" ]; then selected=false; fi
            rm "$changed"
          fi
          echo "selected=$selected" >> "$GITHUB_OUTPUT"
      - if: steps.select.outputs.selected == 'true'
        run: git submodule update --init --depth=1 packages/intentd packages/cloudlands-fe
      # Runner services need not be in the docker group. Use passwordless sudo
      # and a read-only source mount; all installation and generated files stay
      # inside the disposable container, never in the persistent runner checkout.
      - name: Install and check in clean Ubuntu
        if: steps.select.outputs.selected == 'true'
        run: |
          sudo -n docker run --rm --init \
            --env CI=true \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/source,readonly" \
            ubuntu:24.04 bash -euxo pipefail -c '
              mkdir /workspace
              cp -a /source/. /workspace/
              cd /workspace
              apt-get update
              apt-get install -y git curl ca-certificates
              git config --global --add safe.directory "*"
              BOOTSTRAP_YES=1 scripts/bootstrap-dev-host.sh --yes </dev/null
              scripts/bootstrap-dev-host.sh --check | tee check.log
              grep -F "Doctor passed" check.log
              for prefix in \
                "rustup:" \
                "cargo:" \
                "Rust toolchain:" \
                "cargo-nextest:" \
                "cargo-shear:" \
                "Node:" \
                "Corepack:" \
                "frontend package manager:" \
                "frontend dependencies:" \
                "GitHub CLI:" \
                "jq:"; do
                grep -F "[ok]       $prefix" check.log
              done
              grep -F "[optional] xvfb-run: installed" check.log
            '

  # Runs the real .intent/config.json setupScript (scripts/workspace-setup.sh)
  # as root on a minimal Debian image with only git, as a fresh Intent node
  # (an E2B sandbox) has: no make, curl, compiler or Rust. Setup must install
  # them, leave cargo + clippy/rustfmt + cargo-nextest + cargo-sweep usable,
  # and be a no-op on a second run. scripts/workspace-setup.test.sh covers the
  # non-root and no-network branches hermetically.
  workspace-setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0
          persist-credentials: false
      - name: Select workspace setup changes
        id: select
        env:
          EVENT: ${{ github.event_name }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          QUEUE_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          selected=true
          if [ "$EVENT" = merge_group ]; then
            [[ "$QUEUE_BASE" =~ ^[0-9a-f]{40}$ ]]
            test "$(git rev-parse HEAD)" = "$QUEUE_HEAD"
            changed=$(mktemp)
            git diff --name-only "$QUEUE_BASE" HEAD -- .intent/config.json scripts/workspace-setup.sh scripts/workspace-setup.test.sh scripts/retry.sh Makefile .gitmodules .github/workflows/bootstrap-install.yml > "$changed"
            if [ ! -s "$changed" ]; then selected=false; fi
            rm "$changed"
          fi
          echo "selected=$selected" >> "$GITHUB_OUTPUT"
      - name: Extract the setupScript
        if: steps.select.outputs.selected == 'true'
        run: python3 -c 'import json; print(json.load(open(".intent/config.json"))["setupScript"])' > "$RUNNER_TEMP/setup-script.sh"
      - name: Run workspace setup in clean Debian
        if: steps.select.outputs.selected == 'true'
        run: |
          sudo -n docker run --rm --init \
            --env CI=true \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/source,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/setup-script.sh,target=/setup-script.sh,readonly" \
            debian:bookworm-slim bash -euxo pipefail -c '
              apt-get update
              apt-get install -y --no-install-recommends git
              git config --global --add safe.directory "*"
              mkdir /workspace
              cp -a /source/. /workspace/
              cd /workspace
              if command -v cargo; then echo "cargo is preinstalled" >&2; exit 1; fi
              MAIN_CHECKOUT=/workspace WORKTREE_PATH=/workspace bash /setup-script.sh </dev/null
              test -e packages/intentd/.git
              test -e packages/cloudlands-fe/.git
              bash -lc "cargo --version && cargo clippy --version && cargo fmt --version && cargo nextest --version && cargo sweep --version"
              MAIN_CHECKOUT=/workspace WORKTREE_PATH=/workspace bash /setup-script.sh </dev/null 2>&1 | tee rerun.log
              if grep -E "installing|NOTE:" rerun.log; then echo "second setup run was not a no-op" >&2; exit 1; fi
            '

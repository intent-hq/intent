# Reusable consumer checks for the component repos (intent-hq/intentd,
# intent-hq/cloudlands-fe). Their PR CI calls this workflow so a PR that would
# break a monorepo consumer check — method catalog, event catalog, protocol→FE
# field parity, docs-check, check-makefile-targets — is red in that repo before
# it merges, instead of turning monorepo `main` red or stalling the rolling
# `auto/submodule-bump` PR after the fact.
#
# The monorepo is the source of the check: the catalogs, sidecars and docs the
# checks compare against live under docs/protocol/ here, and the check list is
# scripts/consumer-checks.sh — the same runner the monorepo `docs-check` CI job
# uses, so the two lists cannot drift. This job checks out the monorepo at the
# commit this workflow file itself came from — `job.workflow_sha` /
# `job.workflow_repository` from the `job` context (with callers on `@main` that
# is main's tip at call time) — so the workflow and the scripts it runs always
# come from the same monorepo commit; a caller can never see a workflow whose
# runner has not landed yet. Do not use `github.job_workflow_sha` for this: it
# is an OIDC token claim, not a `github` context property, and an unknown
# context property silently evaluates to "" in expressions (cloudlands-fe#2702
# ran with the fallback). The `|| 'main'` fallback keeps the workflow valid
# where `job.workflow_*` is unavailable (GHES). It then replaces the caller's
# submodule directory with the caller's PR head, initializes the other public
# submodule at its pin, and runs the runner in upstream context. packages/ios is
# private and stays uninitialized; a missing iOS fixture is skipped by
# check-event-catalog by design.
#
# Fix order when this job is red: the checks compare the PR head against the
# monorepo docs at that commit, and every checker tolerates docs that lead the
# pin. For an addition, land the monorepo docs PR first (the summary table
# names the file to update; the checks only warn until the component catches
# up), then start a new run; the later submodule bump then lands green. For a
# removal, land the component PR first (this job warns about the now-extra
# docs entry; a docs-first removal is rejected as a component extra) and remove
# the docs entry after the bump. A rename is an addition: document the new name
# first (keep the old entry), rename in the component, then drop the old entry
# after the bump.
#
# Recovery for callers using @main: re-running failed jobs or a specific job
# retains the reusable workflow SHA resolved on the first attempt. Start a new
# run after the monorepo fix lands, or re-run all jobs to resolve @main again.
# https://docs.github.com/en/actions/reference/workflows-and-actions/reusing-workflow-configurations#behavior-of-reusable-workflows-when-re-running-jobs
#
# check-mcp-bindings is advisory here: its generated index must match the
# pinned help text line for line, so the docs cannot lead an intentd change to
# a binding's help line; the auto-bump regenerates the index in its bump commit
# (no manual pin PR) and the check stays a hard error in the monorepo. A failed
# monorepo checkout is fail-soft (::warning::, job green) so a monorepo outage
# never blocks the component repos. The monorepo CI exercise sets self-test:
# it checks out github.sha from the local caller and the named component from
# intent-hq, and makes a monorepo checkout failure fatal. Component callers
# omit that input and retain the workflow revision and fail-soft defaults.
#
# Changed-tests shell suites (intentd callers only): the monorepo drives
# intentd's scripts/changed-tests.sh and scripts/with-test-policy.sh through
# scripts/rust-changed-tests.test.sh, whose stub PATH is a deliberate command
# allowlist. When an intentd PR's own diff (base to the tested merge commit,
# from the caller's github context) changes either script or a file the suites
# copy, scripts/consumer-checks-shell-suites.sh selects that suite and
# intentd's own scripts/test-changed-tests.sh, each run with REQUIRE_BASH3=1
# against a pinned Bash 3.2, so the PR that breaks them is red here. Before
# this, intentd#2720 merged green and the monorepo merge queue ejected the pin
# bump intent#7900 five times ("exec: env: not found") until intent#7905. Other
# intentd PRs pay only for the selection step; cloudlands-fe skips it. Monorepo
# PRs still defer these suites to the merge queue (intent#7191); the self-test
# exercise runs them. Fix order when a change needs both sides (new expected
# argv or output): first land a monorepo rust-changed-tests.test.sh that
# accepts both the pinned and the new behavior (the monorepo queue runs it
# against the pin), then start a new intentd run, and tighten the test after
# the pin bump.
#
# Caller sketch (pull_request + merge_group):
#   monorepo-consumer-checks:
#     uses: intent-hq/intent/.github/workflows/consumer-checks.yml@main
#     with:
#       component: intentd
#       head-sha: ${{ github.event.pull_request.head.sha || github.sha }}
#
# Connected transfer-selection activation: land only after both automated pins
# contain their harnesses. The lightweight runner stays compilation-free; the
# connected step below is required for BOTH caller directions, without path or
# harness-presence skips. The monorepo-outage guard stays fail-soft for component
# callers; the local CI exercise runs this same complete job.
name: Consumer checks

on:
  workflow_call:
    secrets:
      # Self-hosted sccache token; used only when the caller's
      # INTENT_SCCACHE_ENDPOINT variable is set (otherwise uncached).
      INTENT_SCCACHE_TOKEN:
        required: false
      CI_QUEUE_READ_TOKEN:
        required: false
    inputs:
      component:
        description: "Calling component: intentd or cloudlands-fe"
        required: true
        type: string
      head-sha:
        description: "Caller commit to check; defaults to github.sha (on pull_request pass the PR head sha)"
        required: false
        type: string
        default: ""
      self-test:
        description: "Exercise the tested monorepo tree with a pinned component and require checkout success"
        required: false
        type: boolean
        default: false

jobs:
  runner-route:
    uses: ./.github/workflows/runner-route.yml
    permissions:
      contents: read
      actions: read
    secrets:
      CI_QUEUE_READ_TOKEN: ${{ secrets.CI_QUEUE_READ_TOKEN }}

  consumer-checks:
    needs: [runner-route]
    runs-on: ${{ fromJSON(needs.runner-route.outputs.runners || '{}')['gh-linux-8x'] || fromJSON('["warp-ubuntu-2404-x64-8x"]') }}
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      COMPONENT: ${{ inputs.component }}
      COMPONENT_REPOSITORY: ${{ inputs.self-test && format('intent-hq/{0}', inputs.component) || github.repository }}
      HEAD_SHA: ${{ inputs.head-sha || github.sha }}
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate the component input
        id: component
        run: |
          case "$COMPONENT" in
            intentd) other=cloudlands-fe ;;
            cloudlands-fe) other=intentd ;;
            *)
              echo "::error::consumer-checks: unknown component '$COMPONENT' (expected intentd or cloudlands-fe)"
              exit 1
              ;;
          esac
          echo "other=$other" >> "$GITHUB_OUTPUT"
          echo "Checking $COMPONENT_REPOSITORY@${HEAD_SHA:0:7} as packages/$COMPONENT"

      # A reusable workflow's default checkout is the caller repo; the monorepo
      # must be named explicitly, at this workflow file's own commit so the
      # scripts it runs match (the `job` context is read here directly, not via
      # job-level env). Fail-soft: see the guard step below.
      - name: Check out the monorepo at this workflow's commit
        id: monorepo
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.self-test && github.repository || job.workflow_repository || 'intent-hq/intent' }}
          ref: ${{ inputs.self-test && github.sha || job.workflow_sha || 'main' }}
          submodules: false
          persist-credentials: false

      - name: Skip when the monorepo checkout failed
        if: steps.monorepo.outcome != 'success'
        env:
          MONOREPO_REF: ${{ inputs.self-test && github.sha || job.workflow_sha || 'main' }}
          SELF_TEST: ${{ inputs.self-test }}
        run: |
          if [ "${SELF_TEST:-false}" = true ]; then
            echo "::error::consumer-checks: could not check out the tested monorepo@${MONOREPO_REF:0:7}; the local workflow exercise cannot pass."
            exit 1
          fi
          echo "::warning::consumer-checks: could not check out intent-hq/intent@${MONOREPO_REF:0:7}; skipping the monorepo consumer checks for this run."

      - name: Replace packages/${{ inputs.component }} with the caller head
        if: steps.monorepo.outcome == 'success'
        uses: actions/checkout@v7
        with:
          repository: ${{ env.COMPONENT_REPOSITORY }}
          ref: ${{ inputs.head-sha || github.sha }}
          path: packages/${{ inputs.component }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Initialize packages/${{ steps.component.outputs.other }} at its pin
        if: steps.monorepo.outcome == 'success'
        run: git submodule update --init --depth=1 "packages/${{ steps.component.outputs.other }}"

      - uses: actions/setup-node@v7
        if: steps.monorepo.outcome == 'success'
        with:
          node-version: 24

      # `shell: bash` runs the body under `bash -eo pipefail`; the default
      # `run` shell is `bash -e` only, and the `| tee` below would then mask a
      # failing runner behind tee's exit 0.
      - name: Run the consumer checks (upstream context)
        if: steps.monorepo.outcome == 'success'
        shell: bash
        run: |
          log="$RUNNER_TEMP/consumer-checks.log"
          monorepo_sha=$(git rev-parse --short HEAD)
          echo "Checking against intent-hq/intent@$monorepo_sha"
          status=0
          scripts/consumer-checks.sh --context upstream --advisory=check-mcp-bindings 2>&1 | tee "$log" || status=$?
          {
            echo "### monorepo-consumer-checks — $COMPONENT_REPOSITORY@${HEAD_SHA:0:7} vs intent-hq/intent@$monorepo_sha"
            echo
            echo '```'
            sed -n '/^consumer-checks summary$/,$p' "$log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # Path-filtered: see "Changed-tests shell suites" in the header. Runs on
      # pull_request and merge_group alike, so the breaking intentd PR is red.
      - name: Select the intentd changed-tests shell suites
        id: shell-suites
        if: inputs.component == 'intentd' && steps.monorepo.outcome == 'success'
        env:
          SELF_TEST: ${{ inputs.self-test }}
          # The caller's context: its PR or merge-queue base, and the commit
          # GitHub tests (the PR's test-merge commit or the merge group head).
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          TEST_SHA: ${{ github.sha }}
        run: bash scripts/consumer-checks-shell-suites.sh

      # The monorepo checkout's shared step; the cache it restores is the
      # caller repo's, filled on its main by a bash3-cache.yml caller.
      - name: Set up pinned Bash 3.2
        if: steps.shell-suites.outputs.selected == 'true' && steps.monorepo.outcome == 'success'
        uses: ./.github/actions/setup-bash3

      - name: Run the intentd changed-tests shell suites
        if: steps.shell-suites.outputs.selected == 'true' && steps.monorepo.outcome == 'success'
        run: |
          "$BASH3_BIN" --version
          status=0
          REQUIRE_BASH3=1 bash scripts/rust-changed-tests.test.sh || status=1
          REQUIRE_BASH3=1 bash packages/intentd/scripts/test-changed-tests.sh || status=1
          exit "$status"

      - name: Verify connected harnesses and source revisions
        if: github.event_name == 'merge_group' && steps.monorepo.outcome == 'success'
        run: node scripts/test-transfer-selection-contract.mjs --preflight

      - name: Prepare the connected test toolchains
        if: github.event_name == 'merge_group' && steps.monorepo.outcome == 'success'
        shell: bash
        run: |
          # Only an explicit release toolchain, never a caller-controlled PATH.
          toolchain=packages/intentd/rust-toolchain.toml
          if grep -Eq '^[[:space:]]*path[[:space:]]*=' "$toolchain"; then
            echo '::error::connected checks require a release Rust toolchain, not a path override'
            exit 1
          fi
          channel=$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$toolchain")
          [[ "$channel" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo '::error::invalid Rust release channel'; exit 1; }
          # A brief static.rust-lang.org or apt mirror blip must not eject a
          # green PR from the merge queue (cloudlands-fe run 39606176278), so
          # downloads get bounded retries; a failed rustup install rolls back.
          scripts/retry.sh -- rustup toolchain install "$channel" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
          # intent-cache runner images ship the headers and have no sudo.
          if ! command -v pkg-config >/dev/null || ! pkg-config --exists openssl; then
            scripts/retry.sh -- sudo apt-get update -qq
            scripts/retry.sh -- sudo apt-get install -y --no-install-recommends libssl-dev pkg-config
          fi
          corepack enable

      - name: Configure the self-hosted compiler cache
        if: github.event_name == 'merge_group' && steps.monorepo.outcome == 'success'
        shell: bash
        env:
          INTENT_SCCACHE_ENDPOINT: ${{ vars.INTENT_SCCACHE_ENDPOINT }}
          INTENT_SCCACHE_TOKEN: ${{ secrets.INTENT_SCCACHE_TOKEN }}
          INTENT_SCCACHE_MODE: ${{ vars.INTENT_SCCACHE_MODE }}
        run: python3 scripts/setup-sccache.py
      - name: Install the selected renderer dependencies
        if: github.event_name == 'merge_group' && steps.monorepo.outcome == 'success'
        working-directory: packages/cloudlands-fe
        run: corepack pnpm install --frozen-lockfile

      - name: Run the connected transfer selection contract
        if: github.event_name == 'merge_group' && steps.monorepo.outcome == 'success'
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          CARGO_TERM_PROGRESS_WHEN: never
        run: |
          log="$RUNNER_TEMP/transfer-selection.log"
          status=0
          make RUSTUP_CARGO= test-transfer-selection-contract 2>&1 | tee "$log" || status=$?
          {
            echo '### Connected transfer selection contract'
            echo '```'
            cat "$log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

name: CI
# PRs run static contracts, metadata, lint and CI-policy regressions. Runtime
# suites and clean-host installation run on the queued tree. The
# three PR-metadata checks (pr-title / breaking-token / submodule-pins),
# which read `github.event.pull_request.*` / `github.head_ref` /
# `github.base_ref` — none of which exist on merge_group — and already
# covered the identical diff on the PR run, so they stay pull_request-only.
# The `gate` job (CI Gate) aggregates every job into the one context the
# main ruleset requires and is event-aware about those skips. The reusable
# consumer workflow exercise is selected by changed paths in the queue.
#
# Incident: intent-hq/intent#5433 and #5446 were each green alone but broke
# shell-tests together on every PR (intent-hq/intent#5455) for ~14 h — the
# queue landed both without a check run. No `push: branches: [main]` trigger
# on purpose: every main commit's tree is identical to one a merge-group run
# just tested.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read

jobs:
  runner-route:
    uses: ./.github/workflows/runner-route.yml
    with:
      # Fast jobs that start together once routing finishes; each reads
      # outputs.slots[key]. Typical minutes from merge-queue runs rank the free
      # small-pool slots; `events` keeps skipped jobs from holding one. The
      # gate starts after them and keeps the pool-level `runners` mapping.
      slot_jobs: >-
        [
        {"key":"shell-tests","label":"ubuntu-24.04","minutes":4,"events":["merge_group"]},
        {"key":"shell-tests-bash3","label":"ubuntu-24.04","minutes":3,"events":["merge_group"]},
        {"key":"python-tests","label":"ubuntu-24.04","minutes":1,"events":["merge_group"]},
        {"key":"docs-check","label":"ubuntu-24.04","minutes":1},
        {"key":"pr-title","label":"ubuntu-24.04","events":["pull_request"]},
        {"key":"bridge-test","label":"ubuntu-24.04","events":["merge_group"]},
        {"key":"consumer-checks-prepare","label":"ubuntu-24.04"},
        {"key":"event-catalog-check","label":"ubuntu-24.04"},
        {"key":"shell-lint","label":"ubuntu-24.04"},
        {"key":"repo-hygiene","label":"ubuntu-24.04"},
        {"key":"ruleset-check","label":"ubuntu-24.04"},
        {"key":"breaking-token","label":"ubuntu-24.04","events":["pull_request"]},
        {"key":"submodule-pins","label":"ubuntu-24.04","events":["pull_request"]},
        {"key":"triage-parser-test","label":"ubuntu-24.04"},
        {"key":"ci-policy","label":"ubuntu-24.04"}
        ]
    permissions:
      contents: read
      actions: read
    secrets:
      CI_QUEUE_READ_TOKEN: ${{ secrets.CI_QUEUE_READ_TOKEN }}

  # pull_request-only: this validates the PR
  # title, which merge_group does not carry; the gate accepts its skip there.
  pr-title:
    needs: [runner-route]
    runs-on: ${{ fromJSON(needs.runner-route.outputs.slots || '{}')['pr-title'] || fromJSON('["ubuntu-24.04"]') }}
    if: github.event_name == 'pull_request'
    steps:
      # Intermittent TLS failures reaching api.github.com can kill this action
      # sub-second, before it validates anything — a spurious red that reads
      # like a bad title (intent-hq/monorepo#2098). Tolerate a first-attempt
      # failure and retry once; the retry is authoritative, so a genuinely
      # bad title still fails the job.
      - uses: amannn/action-semantic-pull-request@v6
        id: title_check
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            ci
            perf
      - name: Wait before retrying title validation
        if: steps.title_check.outcome == 'failure'
        run: sleep 15
      - uses: amannn/action-semantic-pull-request@v6
        if: steps.title_check.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            ci
            perf

  # The UDS→WS bridge shim (scripts/uds-ws-bridge.mjs) and the UDS JSON-RPC
  # probe (scripts/uds-rpc.mjs) are zero-dependency Node, so their node:test
  # suites need no submodules and use the shared runner routing policy.
  # The breaking-token and submodule-pins unit suites also run here: their
  # own jobs are pull_request-only, so without this the queue never re-tests
  # them on the merged tree. scripts/test-ci-event-policy.py fails CI when a
  # scripts/*.test.{mjs,cjs} suite is not reached from a merge_group job.
  bridge-test:
    if: github.event_name == 'merge_group'
    needs: [runner-route]
    runs-on: ${{ fromJSON(needs.runner-route.outputs.slots || '{}')['bridge-test'] || fromJSON('["ubuntu-24.04"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test scripts/uds-ws-bridge.test.mjs
      - run: node --test scripts/uds-rpc.test.mjs
      - run: node --test scripts/check-breaking-token.test.mjs scripts/check-submodule-pins.test.mjs

  # Standard-library-only Python suites run without submodules. Use the same
  # entry point locally and in CI; tomllib requires Python 3.11 or newer.
  # Includes offline prerelease retention/deletion tests and a functional check
  # that their failures fail this target. No cleanup credentials or live scan.
  python-tests:
    if: github.event_name == 'merge_group'
    needs: [runner-route]
    runs-on: ${{ fromJSON(needs.runner-route.outputs.slots || '{}')['python-tests'] || fromJSON('["ubuntu-24.04"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: make test-scripts

  # Always prepare on both PR and queue runs. Read the pin from the same
  # tested tree as the local reusable call; a failed diff/read must fail CI,
  # not turn into an intentional path skip.
  consumer-checks-prepare:
    needs: [runner-route]
    runs-on: ${{ fromJSON(needs.runner-route.outputs.slots || '{}')['consumer-checks-prepare'] || fromJSON('["ubuntu-24.04"]') }}
    outputs:
      selected: ${{ steps.select.outputs.selected }}
      intentd-sha: ${{ steps.select.outputs.intentd-sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Select the consumer workflow exercise and pinned intentd
        id: select
        run: node scripts/consumer-checks-ci.mjs

  # Local uses loads the workflow from this run's revision, so broken action
  # references and setup fail before merge. Keep the full connected exercise.
  consumer-checks-exercise:
    needs: consumer-checks-prepare
    if: github.event_name == 'merge_group' && needs.consumer-checks-prepare.outputs.selected == 'true'
    permissions:
      contents: read
      pull-requests: read
      actions: read
    secrets:
      CI_QUEUE_READ_TOKEN: ${{ secrets.CI_QUEUE_READ_TOKEN }}
      INTENT_SCCACHE_TOKEN: ${{ secrets.INTENT_SCCACHE_TOKEN }}
    uses: ./.github/workflows/consumer-checks.yml
    with:
      component: intentd
      head-sha: ${{ needs.consumer-checks-prepare.outputs.intentd-sha }}
      self-test: true

  # Documentation invariants include the public frontend agent guide, the
  # browser-tab contract surfaces in cloudlands-fe and intentd, and the
  # protocol method catalog (docs/protocol/05-method-catalog.md ↔ methods/*.md
  # ↔ intentd's catalog.rs), and the MCP `ws.*` bindings index
  # (docs/protocol/methods/mcp-bindings.md plus prose signature mentions ↔ the
  # help-text constants in intentd's mcp_server/tools.rs; check-mcp-bindings,
  # run by make docs-check). The root Makefile's intentd crate / `--test`
  # references must also exist at the pinned intentd gitlink
  # (check-makefile-targets), so a Makefile change that depends on an unmerged
  # intentd PR fails here until the auto-bump lands. Every wire field emitted
  # by the intentd row structs must be present in the cloudlands-fe type that
  # consumes it (check-protocol-field-parity). Initialize only those
  # submodules; packages/ios is private and intentionally untouched.
  # `make consumer-checks` (scripts/consumer-checks.sh) runs that whole set
  # as individual make targets and ends with a per-check table naming the
  # monorepo file(s) to update; the upstream intentd / cloudlands-fe consumer
  # job runs the same script, so the two lists cannot drift.
  #
  # With both component checkouts present, the doc-link checker also runs
  # here (repo-hygiene runs it without submodules, where ~30 component
  # references are unverifiable): a doc path or heading link into intentd or
  # cloudlands-fe must exist at the pins, and the components' own AGENTS.md
  # links must resolve. Bare paths are never looked up in the private
  # packages/ios (`update = none`), so a missing one fails instead of being
  # skipped. It runs last, even after a failed step, so a red bump still shows
  # the consumer-checks table. It is deliberately not part of
  # `make consumer-checks`, so component PRs are never failed by monorepo
  # docs; a component change that breaks such a link turns the
  # auto/submodule-bump PR red instead. Rename a linked component
  # heading as an addition — keep `<a id="old-slug"></a>` beside it until the
  # bump lands and the monorepo link moves — and if a bump is already red,
  # land a monorepo fix that resolves at both pins (drop the anchor, link a
  # heading present in both, or remove the reference) and re-run the bump.
  # Incident: docs/protocol/README.md named an intentd script that existed
  # only on an unmerged branch for about three weeks.
  docs-check:
    needs: [runner-route]
    runs-on: ${{ fromJSON(needs.runner-route.outputs.slots || '{}')['docs-check'] || fromJSON('["ubuntu-24.04"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: submodules
        run: git submodule update --init --depth=1 packages/cloudlands-fe packages/intentd
      - run: node --test scripts/submodule-ref.test.mjs
      - run: node --test scripts/check-protocol-catalog.test.mjs
      - run: node --test docs/protocol/fixtures/scripts/readiness.test.mjs
      - run: >-
          node --test
          docs/protocol/fixtures/desktop-control/contract.test.mjs
          docs/protocol/fixtures/event-stream-recovery/contract.test.mjs
          docs/protocol/fixtures/nodes/checkpoint-capture.test.mjs
          docs/protocol/fixtures/nodes/enrollment.test.mjs
          docs/protocol/fixtures/nodes/local-source.test.mjs
          docs/protocol/fixtures/nodes/platform-routing.test.mjs
          docs/protocol/fixtures/scripts/active-monitors.test.mjs
          docs/protocol/fixtures/scripts/compact.test.mjs
          docs/protocol/fixtures/startup/contract.test.mjs
      - run: node --test scripts/check-mcp-bindings.test.mjs
      - run: node --test scripts/check-makefile-targets.test.mjs
      - run: node --test scripts/check-protocol-field-parity.test.mjs
      - run: node --test scripts/check-transfer-selection-contract.test.mjs scripts/test-transfer-selection-contract.test.mjs scripts/transfer-selection-ci.test.mjs
      - run: node --test scripts/backend-keychain-contract.test.mjs
      - run: make check-agent-worker-contract
      - run: node --test scripts/check-app-ui-targets.test.mjs
      - run: node --test scripts/consumer-checks-ci.test.mjs
      - run: make consumer-checks
      - name: Check doc links against the pinned components
        if: ${{ !cancelled() && steps.submodules.outcome == 'success' }}
        run: node scripts/check-doc-links.mjs

  # The event-type catalog is vendored on three surfaces (intentd golden,
  # protocol sidecar, iOS test fixture). The public intentd copy is checked out
  # at its pin. packages/ios is private: its fixture is fetched at the pinned
  # gitlink via the API with SUBMODULE_BUMP_TOKEN when present and skipped with
  # a warning otherwise (mirrors auto-bump-submodules.yml's ios handling).
  event-catalog-check:
    needs: [runner-route]
    runs-on: ${{ fromJSON(needs.runner-route.outputs.slots || '{}')['event-catalog-check'] || fromJSON('["ubuntu-24.04"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test scripts/check-event-catalog.test.mjs
      - run: git submodule update --init --depth=1 packages/intentd
      - name: Fetch the iOS fixture at the pinned gitlink (best-effort)
        env:
          GH_TOKEN: ${{ secrets.SUBMODULE_BUMP_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::SUBMODULE_BUMP_TOKEN is not set; skipping the packages/ios event catalog check."
            exit 0
          fi
          pin=$(git rev-parse HEAD:packages/ios)
          dest=packages/ios/IntentTests/Fixtures/event_types.json
          mkdir -p "$(dirname "$dest")"
          if ! gh api -H "Accept: application/vnd.github.raw" \
              "repos/intent-hq/ios/contents/IntentTests/Fixtures/event_types.json?ref=$pin" > "$dest"; then
            echo "::warning::Could not fetch IntentTests/Fixtures/event_types.json from intent-hq/ios@${pin:0:7}; skipping the packages/ios event catalog check."
            rm -f "$dest"
          fi
      - run: make event-catalog-check

  # Hermetic shell suites stub daemon, cargo, and pnpm behavior where needed.
  # rust-changed-tests.test.sh drives the real `make test-changed` recipe
  # through intentd's scripts/changed-tests.sh, so both legs check out the
  # public intentd submodule at its pin (shallow, the same way
  # event-catalog-check does); packages/ios stays `update = none`.
  shell-tests:
    if: github.event_name == 'merge_group'
    needs: [runner-route]
    runs-on: ${{ fromJSON(needs.runner-route.outputs.slots || '{}')['shell-tests'] || fromJSON('["ubuntu-24.04"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: git submodule update --init --depth=1 packages/intentd
      - run: |
          echo "shell tests: host-specific daemon and pnpm behavior is stubbed"
          bash scripts/auto-bump-submodules.test.sh
          bash scripts/bootstrap-dev-host.test.sh
          bash scripts/ci-gate.test.sh
          python3 -S -B scripts/test_hosted_runners.py
          python3 -S -B scripts/test_ci_bash3.py
          python3 -S -B scripts/test_setup_sccache.py
          python3 -S -B scripts/test_local_sccache.py
          bash scripts/consumer-checks.test.sh
          bash scripts/dev-ports.test.sh
          bash scripts/dev-sandbox.test.sh
          bash scripts/dev-status.test.sh
          python3 scripts/test_github_readiness.py
          bash scripts/docs-check.test.sh
          bash scripts/lint-fixed-sleeps.test.sh
          bash scripts/rust-changed-tests.test.sh
          python3 -S -B scripts/test_rust_test_policy.py
          bash scripts/shipped-in.test.sh
          bash scripts/release-status.test.sh
          bash scripts/lint-fixed-sleeps.sh
      # sccache cache server (infra/sccache): real Caddy + rclone on loopback,
      # pinned and checksum-verified, so the token access matrix never skips here.
      - name: sccache server test
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/sccache-server-bin"
          mkdir -p "$bin" && cd "$bin"
          curl -sSfL -o caddy.tgz https://github.com/caddyserver/caddy/releases/download/v2.10.2/caddy_2.10.2_linux_amd64.tar.gz
          echo "747df7ee74de188485157a383633a1a963fd9233b71fbb4a69ddcbcc589ce4e2cc82dacf5dbbe136cb51d17e14c59daeb5d9bc92487610b0f3b93680b2646546  caddy.tgz" | sha512sum -c -
          tar xzf caddy.tgz caddy
          curl -sSfL -o rclone.zip https://downloads.rclone.org/v1.71.1/rclone-v1.71.1-linux-amd64.zip
          echo "417e3da236f3a12d292da4e7287d67b1df558b8c2b280d092e563958ed724be7  rclone.zip" | sha256sum -c -
          python3 -I -c "import zipfile,shutil; z=zipfile.ZipFile('rclone.zip'); shutil.copyfileobj(z.open('rclone-v1.71.1-linux-amd64/rclone'), open('rclone','wb'))"
          chmod +x caddy rclone
          cd "$GITHUB_WORKSPACE"
          CADDY_BIN="$bin/caddy" RCLONE_BIN="$bin/rclone" python3 -S -B infra/sccache/test_server.py -v
          bash -n infra/sccache/bootstrap.sh
          command -v shellcheck >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }
          shellcheck infra/sccache/*.sh
      # GitHub runner slots (infra/runners): supervisor and installer against
      # stubbed curl/docker/systemctl.
      - name: runner slots test
        run: |
          set -euo pipefail
          python3 -S -B infra/runners/test_runners.py -v
          command -v shellcheck >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }
          shellcheck infra/runners/*.sh

  # shellcheck over scripts/*.sh. Quoting and Bash-3 portability slips in the
  # repo scripts reached main because nothing linted them (intent-hq/intent#5638);
  # `make lint-shell` runs the pinned rule set from .shellcheckrc against the
  # ShellCheck binary, installed explicitly when absent.
  shell-lint:
    needs: [runner-route]
    runs-on: ${{ fromJSON(needs.runner-route.outputs.slots || '{}')['shell-lint'] || fromJSON('["ubuntu-24.04"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Install ShellCheck when absent
        run: |
          if ! command -v shellcheck >/dev/null; then
            for attempt in 1 2 3; do
              if sudo -n apt-get -o DPkg::Lock::Timeout=300 update -qq; then break; fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              sleep $((attempt * 15))
            done
            sudo -n apt-get -o DPkg::Lock::Timeout=300 install -y -qq shellcheck
          fi
      - run: shellcheck --version
      - run: make lint-shell

  # Keep stock macOS Bash 3.2 compatibility without renting a Mac for shell tests.
  # A pinned Linux build runs the same suites; REQUIRE_BASH3 forbids silent skips.
  shell-tests-bash3:
    if: github.event_name == 'merge_group'
    needs: [runner-route]
    runs-on: ${{ fromJSON(needs.runner-route.outputs.slots || '{}')['shell-tests-bash3'] || fromJSON('["ubuntu-24.04"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: git submodule update --init --depth=1 packages/intentd
      - name: Install Bash build prerequisites when absent
        run: |
          if ! command -v yacc >/dev/null || ! command -v gcc >/dev/null; then
            for attempt in 1 2 3; do
              if sudo -n apt-get -o DPkg::Lock::Timeout=300 update -qq; then break; fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              sleep $((attempt * 15))
            done
            sudo -n apt-get -o DPkg::Lock::Timeout=300 install -y -qq build-essential bison
          fi
      - name: Install pinned Bash 3.2
        run: bash scripts/install-ci-bash3.sh "$RUNNER_TEMP/bash3"
      - run: |
          "$BASH3_BIN" --version
          REQUIRE_BASH3=1 bash scripts/ci-gate.test.sh
          REQUIRE_BASH3=1 bash scripts/consumer-checks.test.sh
          REQUIRE_BASH3=1 bash scripts/docs-check.test.sh
          REQUIRE_BASH3=1 DEV_SANDBOX_TEST_STARTUP_ONLY=1 "$BASH3_BIN" scripts/dev-sandbox.test.sh
          REQUIRE_BASH3=1 bash scripts/lint-fixed-sleeps.test.sh
          REQUIRE_BASH3=1 bash scripts/rust-changed-tests.test.sh
          REQUIRE_BASH3=1 bash scripts/shipped-in.test.sh
          REQUIRE_BASH3=1 bash scripts/release-status.test.sh

  # Agent-facing documentation links and root hygiene are checked without
  # dependencies or initialized submodules (docs-check reruns the link
  # checker against the pinned component checkouts).
  repo-hygiene:
    needs: [runner-route]
    runs-on: ${{ fromJSON(needs.runner-route.outputs.slots || '{}')['repo-hygiene'] || fromJSON('["ubuntu-24.04"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test scripts/check-doc-links.test.mjs
      - run: node scripts/check-doc-links.mjs
      - run: node --test scripts/check-root-hygiene.test.mjs
      - run: node scripts/check-root-hygiene.mjs

  # The expected `main` rules of intent, intentd and cloudlands-fe (required
  # `CI Gate`, thread resolution, merge-queue settings) are committed in
  # .github/rulesets/*.main.json; this compares them with the live effective
  # rules so a silent ruleset edit fails the PR and the merge_group run
  # instead of letting the queue land untested trees (intent-hq/intent#5476,
  # #5455). Public endpoint, so GITHUB_TOKEN only lifts the rate limit;
  # transient API failures warn and pass. The effective rules omit each
  # ruleset's bypass_actors, which GitHub returns only to a caller with
  # administration read; their comparison with .github/rulesets/*.bypass.json
  # (#5510) is deliberately confined to ruleset-drift.yml, which runs main's
  # code on a schedule: this job runs scripts/check-rulesets.mjs from the PR
  # head or the merged tree, so RULESET_ADMIN_TOKEN (administration read on all
  # three repositories) is never passed to it. Without the token the script
  # skips the bypass actors with a notice and still checks the rules.
  # ruleset-drift.yml also covers the rules daily, since a ruleset edit on
  # GitHub triggers no PR.
  ruleset-check:
    needs: [runner-route]
    runs-on: ${{ fromJSON(needs.runner-route.outputs.slots || '{}')['ruleset-check'] || fromJSON('["ubuntu-24.04"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test scripts/check-rulesets.test.mjs
      - run: node scripts/check-rulesets.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Guard release footer tokens in PR prose and branch commit messages unless
  # the release impact is explicitly acknowledged with a label.
  # pull_request-only: reads the PR body, labels and base_ref, none of which
  # exist on merge_group; the gate accepts its skip there.
  breaking-token:
    needs: [runner-route]
    runs-on: ${{ fromJSON(needs.runner-route.outputs.slots || '{}')['breaking-token'] || fromJSON('["ubuntu-24.04"]') }}
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test scripts/check-breaking-token.test.mjs
      - name: Check pull request and commit messages
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          git log --format=%B "origin/${{ github.base_ref }}..HEAD" > "$RUNNER_TEMP/branch-commit-messages"
          node scripts/check-breaking-token.mjs "$RUNNER_TEMP/branch-commit-messages"

  # Submodule pins are advanced only by the auto-bump-submodules workflow
  # (auto/submodule-bump). Reject gitlink changes in any other PR — a
  # workspace branch that checked out a submodule feature branch can carry
  # one unnoticed — unless the submodule-pin-intended label is applied.
  # pull_request-only: reads head_ref, base_ref and PR labels, none of which
  # exist on merge_group; the gate accepts its skip there.
  submodule-pins:
    needs: [runner-route]
    runs-on: ${{ fromJSON(needs.runner-route.outputs.slots || '{}')['submodule-pins'] || fromJSON('["ubuntu-24.04"]') }}
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test scripts/check-submodule-pins.test.mjs
      - name: Check for manual submodule pin changes
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node scripts/check-submodule-pins.mjs --base "origin/${{ github.base_ref }}"

  # The issue-triage body parser (.github/scripts/issue-triage/) is also
  # zero-dependency Node with a fixture-driven node:test suite.
  triage-parser-test:
    needs: [runner-route]
    runs-on: ${{ fromJSON(needs.runner-route.outputs.slots || '{}')['triage-parser-test'] || fromJSON('["ubuntu-24.04"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test .github/scripts/issue-triage/parse-issue.test.js .github/scripts/issue-triage/needs-info.test.js .github/scripts/issue-triage/agentic-triage.test.js

  # Aggregate gate: the single `CI Gate` context the main ruleset requires
  # (same pattern as intentd's gate job). always() so a failed or cancelled
  # need still produces a (failing) result rather than a missing check.
  # The result matrix lives in scripts/ci-gate.sh (covered by
  # scripts/ci-gate.test.sh in shell-tests): the always-on jobs must succeed
  # outright on every event; the pull_request-only jobs must succeed outright
  # on pull_request and must be job-skipped on merge_group — a skip on
  # pull_request, a run on merge_group, or any other event is a
  # misconfiguration and fails. Preparation must succeed, and the consumer
  # exercise must match its path selection (success or intentional skip).
  # The self-test diffs the script's job list against this needs list,
  # so keep both in step.
  bootstrap-install:
    if: github.event_name == 'merge_group'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/bootstrap-install.yml
    secrets: inherit

  ci-policy:
    needs: [runner-route]
    runs-on: ${{ fromJSON(needs.runner-route.outputs.slots || '{}')['ci-policy'] || fromJSON('["ubuntu-24.04"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python3 -m pip install 'PyYAML==6.0.3'
      - run: bash scripts/ci-gate.test.sh
      - run: python3 -I -B scripts/test-ci-event-policy.py

  gate:
    name: CI Gate
    runs-on: ${{ fromJSON(needs.runner-route.outputs.runners || '{}')['ubuntu-24.04'] || fromJSON('["ubuntu-24.04"]') }}
    permissions: {}
    if: always()
    needs: [ci-policy, bootstrap-install, pr-title, bridge-test, python-tests, docs-check, event-catalog-check, shell-tests, shell-lint, shell-tests-bash3, repo-hygiene, ruleset-check, breaking-token, submodule-pins, triage-parser-test, consumer-checks-prepare, consumer-checks-exercise, runner-route]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Check results
        env:
          GATE_EVENT: ${{ github.event_name }}
          GATE_NEEDS_JSON: ${{ toJSON(needs) }}
          GATE_CONSUMER_CHECKS_SELECTED: ${{ needs.consumer-checks-prepare.outputs.selected }}
        run: bash scripts/ci-gate.sh

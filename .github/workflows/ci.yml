name: CI
on: [push, pull_request]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title:
    runs-on: [self-hosted, Linux, X64]
    if: github.event_name == 'pull_request'
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            ci
            perf

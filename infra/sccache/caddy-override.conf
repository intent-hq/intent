# Drop-in for the packaged caddy.service, installed as
# /etc/systemd/system/caddy.service.d/sccache.conf by bootstrap.sh.
# Loads the token env file and drops `--environ` from the packaged ExecStart
# so the tokens are never printed to the journal.
[Service]
EnvironmentFile=/etc/sccache/caddy.env
ExecStartPre=/usr/local/lib/sccache/check-caddy-env.sh
ExecStart=
ExecStart=/usr/bin/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
ExecReload=
ExecReload=/usr/bin/caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile --force

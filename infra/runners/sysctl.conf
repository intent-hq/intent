# Installed by infra/runners/install.sh as /etc/sysctl.d/90-github-runners.conf.
# fs.inotify.* is not namespaced: with Docker's user-namespace remapping every
# slot's inotify instances are charged to the namespaces' owner (root) on the
# host, a budget the host's own daemons share. The 128 default left a runner
# container 106. Sizing rule: 4096 for each heavy or xl slot that can run
# intentd's coverage-all (at most 3 per host, so 12288), plus the small slots
# and the host's daemons; 32768 leaves more than half spare. An instance costs
# kernel memory only while it is open.
fs.inotify.max_user_instances = 32768
fs.inotify.max_user_watches = 1048576

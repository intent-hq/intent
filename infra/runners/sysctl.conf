# Installed by infra/runners/install.sh as /etc/sysctl.d/90-github-runners.conf.
# Docker's user-namespace remapping charges every slot's inotify instances to
# one host user, so the 128 default is shared by all slots on a host (a job hit
# EMFILE at 106). intentd's coverage-all needs 4096 on its own.
fs.inotify.max_user_instances = 8192
fs.inotify.max_user_watches = 1048576
